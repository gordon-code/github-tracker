name: Deploy
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to checkout and deploy"
        required: false
        type: string
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/verify
        with:
          vite-github-client-id: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          deploy-domain: ${{ vars.DEPLOY_DOMAIN }}
      - name: Validate deploy configuration
        run: pnpm validate:deploy
        env:
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          VITE_JIRA_CLIENT_ID: ${{ vars.VITE_JIRA_CLIENT_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm run build
        env:
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          VITE_JIRA_CLIENT_ID: ${{ vars.VITE_JIRA_CLIENT_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LC_ALL: C.UTF-8
          DEPLOY_TAG: ${{ github.sha }}
          RAW_MSG: ${{ github.event.head_commit.message }}
        run: |
          DEPLOY_TAG="${DEPLOY_TAG:0:25}"
          FIRST_LINE="${RAW_MSG%%$'\n'*}"
          DEPLOY_MSG="$(tr -d '\000-\037\177' <<< "$FIRST_LINE")"
          DEPLOY_MSG="${DEPLOY_MSG:0:100}"
          DEPLOY_MSG="${DEPLOY_MSG:-manual deploy ${DEPLOY_TAG}}"
          pnpm exec wrangler deploy --tag "$DEPLOY_TAG" --message "$DEPLOY_MSG"
      # Update detection ignores a /version.json that is missing or served as the SPA's HTML
      # fallback, so confirm the live file is JSON and names the build that was just deployed.
      - name: Verify deployed version.json
        if: ${{ vars.DEPLOY_DOMAIN != '' }}
        env:
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          expected="${EXPECTED_SHA:0:12}"
          for attempt in 1 2 3 4 5 6; do
            out="$(curl -sS --max-time 10 -w '\n%{content_type}' "https://${DEPLOY_DOMAIN}/version.json" || true)"
            ctype="${out##*$'\n'}"
            json="${out%$'\n'*}"
            sha="$(jq -r '.sha // empty' <<< "$json" 2>/dev/null || true)"
            if [[ "$ctype" == application/json* && "$sha" == "$expected" ]]; then
              printf 'version.json OK (%s)\n' "$sha"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          printf 'version.json did not report %s with a JSON content type\n' "$expected" >&2
          exit 1
