name: Release
on:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: release-please
  cancel-in-progress: false
jobs:
  release-please:
    if: github.repository == 'gordon-code/github-tracker'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: release
    outputs:
      app_release_created: ${{ steps.rp.outputs.release_created }}
      app_tag: ${{ steps.rp.outputs.tag_name }}
      mcp_release_created: ${{ steps.rp.outputs['mcp--release_created'] }}
      mcp_tag: ${{ steps.rp.outputs['mcp--tag_name'] }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    needs: release-please
    if: github.repository == 'gordon-code/github-tracker' && needs.release-please.outputs.app_release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release-please.outputs.app_tag }}
    secrets: inherit

  publish-mcp:
    needs: release-please
    if: github.repository == 'gordon-code/github-tracker' && needs.release-please.outputs.mcp_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.mcp_tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          registry-url: "https://registry.npmjs.org"
      - run: pnpm --filter github-tracker-mcp run typecheck
      - run: pnpm --filter github-tracker-mcp run build
      - run: pnpm --filter github-tracker-mcp test
      - run: cd mcp && pnpm publish --access public --no-git-checks --provenance
